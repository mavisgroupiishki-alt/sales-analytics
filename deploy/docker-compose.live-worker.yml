# Merge this file with the existing DigitalOcean n8n compose project.
# The worker has no published port: n8n reaches it only on Docker's private
# network at http://jarvis-worker:8080/internal/sync.
services:
  jarvis-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.live-worker
    restart: unless-stopped
    environment:
      BITRIX_WEBHOOK_URL: ${BITRIX_WEBHOOK_URL:?set in .env}
      VIBE_API_KEY: ${VIBE_API_KEY:?set in .env}
      JARVIS_DATABASE_URL: ${JARVIS_DATABASE_URL:?set in .env}
      JARVIS_RUBRIC_ID: ${JARVIS_RUBRIC_ID:?set in .env}
      JARVIS_SYNC_SECRET: ${JARVIS_SYNC_SECRET:?set in .env}
      JARVIS_RUNTIME_DIR: /var/lib/jarvis
    volumes:
      - jarvis_runtime:/var/lib/jarvis
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  jarvis_runtime:
