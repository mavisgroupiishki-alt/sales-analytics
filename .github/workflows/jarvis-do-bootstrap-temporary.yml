name: Temporary Jarvis DigitalOcean bootstrap

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Safe temporary operation
        required: true
        default: bootstrap
        type: choice
        options:
          - bootstrap
          - status
          - diagnostics
          - deploy_analysis_fix

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the fixed worker
        if: inputs.operation == 'deploy_analysis_fix'
        uses: actions/checkout@v4

      - name: Prepare temporary SSH access
        env:
          JARVIS_DO_SSH_KEY: ${{ secrets.JARVIS_DO_SSH_KEY_TMP }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$JARVIS_DO_SSH_KEY" > "$HOME/.ssh/jarvis_do"
          chmod 0600 "$HOME/.ssh/jarvis_do"
          printf '%s\n' '147.182.140.114 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINzrGaSuchVowpE36ssltqbYgnHLb4t/PDLJay7kPP4D' > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"

      - name: Deploy the fixed analysis worker and retry incomplete calls
        if: inputs.operation == 'deploy_analysis_fix'
        run: |
          set -euo pipefail
          tar --exclude=.git -czf /tmp/jarvis-worker-87e816f.tgz .
          scp \
            -i "$HOME/.ssh/jarvis_do" \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=30 \
            /tmp/jarvis-worker-87e816f.tgz \
            root@147.182.140.114:/tmp/jarvis-worker-87e816f.tgz
          ssh \
            -i "$HOME/.ssh/jarvis_do" \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=10 \
            root@147.182.140.114 '
              set -eu
              workflow_id=$(docker exec deploy-n8n-1 n8n list:workflow | awk -F"|" "/Jarvis — live Bitrix calls every 5 minutes/{print \$1; exit}")
              test -n "$workflow_id"
              docker exec deploy-n8n-1 n8n update:workflow --id="$workflow_id" --active=false
              reactivate_jarvis_workflow() {
                docker exec deploy-n8n-1 n8n update:workflow --id="$workflow_id" --active=true >/dev/null 2>&1 || true
              }
              trap reactivate_jarvis_workflow EXIT
              install -d -m 0755 /opt/mavis-pilot/jarvis-worker-87e816f
              tar -xzf /tmp/jarvis-worker-87e816f.tgz -C /opt/mavis-pilot/jarvis-worker-87e816f
              docker build \
                -t jarvis-worker:87e816f \
                -f /opt/mavis-pilot/jarvis-worker-87e816f/deploy/Dockerfile.live-worker \
                /opt/mavis-pilot/jarvis-worker-87e816f
              printf "%s\n" \
                "services:" \
                "  jarvis-worker:" \
                "    image: jarvis-worker:87e816f" \
                > /opt/mavis-pilot/jarvis-worker-image.override.yml
              docker compose \
                --env-file /opt/mavis-pilot/deploy/.env \
                --env-file /opt/mavis-pilot/jarvis-worker.env \
                -p deploy \
                -f /opt/mavis-pilot/deploy/docker-compose.yml \
                -f /opt/mavis-pilot/jarvis-worker-87e816f/deploy/docker-compose.live-worker.yml \
                -f /opt/mavis-pilot/jarvis-n8n-secret.override.yml \
                -f /opt/mavis-pilot/jarvis-worker-image.override.yml \
                up -d --no-build --force-recreate jarvis-worker
              for attempt in $(seq 1 30); do
                if docker exec deploy-jarvis-worker-1 python -c "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8080/health\", timeout=3)"; then
                  break
                fi
                if [ "$attempt" -eq 30 ]; then
                  docker logs --tail 100 deploy-jarvis-worker-1
                  exit 1
                fi
                sleep 2
              done
              target_ids=$(docker exec deploy-jarvis-worker-1 python -c "import json,pathlib; p=pathlib.Path(\"/var/lib/jarvis\"); calls=json.loads((p/\"calls_data.json\").read_text()); analyses=json.loads((p/\"analyses.json\").read_text()); files={f.name.split(\"_\")[0] for f in (p/\"audio_temp\").glob(\"*.mp3\")}; print(\",\".join(str(c[\"activity_id\"]) for c in calls if c.get(\"audio\") and str(c[\"audio\"].get(\"file_id\")) in files and int(c.get(\"duration_sec\") or 0) >= 30 and (str(c[\"activity_id\"]) not in analyses or (((analyses.get(str(c[\"activity_id\"])) or {}).get(\"analysis\") or {}).get(\"overall_score\") is None and not (((analyses.get(str(c[\"activity_id\"])) or {}).get(\"analysis\") or {}).get(\"exclude_from_stats\"))))))")
              if [ -n "$target_ids" ]; then
                target_count=$(printf "%s" "$target_ids" | awk -F, "{print NF}")
                echo "Retrying incomplete analyses: $target_count"
                docker exec \
                  -e REANALYZE_ID="$target_ids" \
                  -e REANALYZE_TODAY=0 \
                  -e JARVIS_FORCE_ANALYSIS_VERSION=1 \
                  -e NOTIFY_MANAGERS=0 \
                  -w /var/lib/jarvis \
                  deploy-jarvis-worker-1 \
                  python /app/src/claude_analyzer.py
              else
                echo "No incomplete analyses remain"
              fi
              docker inspect deploy-jarvis-worker-1 --format "{{.Config.Image}}"
            '

      - name: Transfer the approved worker environment to DigitalOcean
        if: inputs.operation == 'bootstrap'
        env:
          JARVIS_WORKER_ENV: ${{ secrets.JARVIS_WORKER_ENV_TMP }}
          VIBE_API_KEY: ${{ secrets.VIBE_API_KEY }}
        run: |
          set -euo pipefail
          printf '%s\n' "$JARVIS_WORKER_ENV" > /tmp/jarvis-worker.env
          printf 'VIBE_API_KEY=%s\n' "$VIBE_API_KEY" >> /tmp/jarvis-worker.env
          chmod 0600 /tmp/jarvis-worker.env
          scp \
            -i "$HOME/.ssh/jarvis_do" \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=30 \
            /tmp/jarvis-worker.env \
            root@147.182.140.114:/opt/mavis-pilot/jarvis-worker.env

      - name: Start Jarvis worker and wire n8n
        if: inputs.operation == 'bootstrap'
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/jarvis_do" \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=10 \
            root@147.182.140.114 '
              set -eu
              printf "%s\n" \
                "services:" \
                "  jarvis-worker:" \
                "    image: jarvis-worker:4f6e5e1" \
                > /opt/mavis-pilot/jarvis-worker-image.override.yml
              docker compose \
                --env-file /opt/mavis-pilot/deploy/.env \
                --env-file /opt/mavis-pilot/jarvis-worker.env \
                -p deploy \
                -f /opt/mavis-pilot/deploy/docker-compose.yml \
                -f /opt/mavis-pilot/jarvis-worker-4f6e5e1/deploy/docker-compose.live-worker.yml \
                -f /opt/mavis-pilot/jarvis-n8n-secret.override.yml \
                -f /opt/mavis-pilot/jarvis-worker-image.override.yml \
                up -d --no-build n8n jarvis-worker

              for attempt in $(seq 1 30); do
                if docker exec deploy-jarvis-worker-1 python -c "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8080/health\", timeout=3)"; then
                  break
                fi
                if [ "$attempt" -eq 30 ]; then
                  docker logs --tail 100 deploy-jarvis-worker-1
                  exit 1
                fi
                sleep 2
              done

              docker cp /opt/mavis-pilot/jarvis-worker-4f6e5e1/deploy/n8n-jarvis-live-sync.json deploy-n8n-1:/tmp/n8n-jarvis-live-sync.json
              workflow_id=$(docker exec deploy-n8n-1 n8n list:workflow | awk -F"|" "/Jarvis — live Bitrix calls every 5 minutes/{print \$1; exit}")
              if [ -z "$workflow_id" ]; then
                docker exec deploy-n8n-1 n8n import:workflow --input=/tmp/n8n-jarvis-live-sync.json
                workflow_id=$(docker exec deploy-n8n-1 n8n list:workflow | awk -F"|" "/Jarvis — live Bitrix calls every 5 minutes/{print \$1; exit}")
              fi
              test -n "$workflow_id"
              docker exec deploy-n8n-1 n8n update:workflow --id="$workflow_id" --active=true

              docker exec deploy-jarvis-worker-1 python -c "import json, os, urllib.request; request=urllib.request.Request(\"http://127.0.0.1:8080/internal/sync\", data=json.dumps({\"mode\":\"reanalyze_day\",\"date\":\"2026-09-08\"}).encode(), headers={\"Content-Type\":\"application/json\",\"x-jarvis-sync-secret\":os.environ[\"JARVIS_SYNC_SECRET\"]}, method=\"POST\"); print(urllib.request.urlopen(request, timeout=10).read().decode())"
              docker ps --filter name=deploy-jarvis-worker-1 --filter name=deploy-n8n-1 --format "{{.Names}} {{.Status}}"
            '

      - name: Read worker status without call data
        if: inputs.operation == 'status'
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/jarvis_do" \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=30 \
            root@147.182.140.114 \
            'docker exec deploy-jarvis-worker-1 python -c "import urllib.request; print(urllib.request.urlopen(\"http://127.0.0.1:8080/health\", timeout=5).read().decode())"'

      - name: Read sanitized AI diagnostics
        if: inputs.operation == 'diagnostics'
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/jarvis_do" \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=30 \
            root@147.182.140.114 '
              set -eu
              echo "Worker error summary:"
              docker logs --since 2026-09-09T07:57:00Z deploy-jarvis-worker-1 2>&1 \
                | grep -E "HTTPError:|JSONDecodeError:|ReadTimeout:|ConnectTimeout:|RuntimeError:|❌|⚠|Транскрипт:|Короткий звонок|В закрытую базу сохранено|Успешно:|Ошибок:" \
                | sed -E "s/[A-Fa-f0-9]{24,}/[redacted]/g" \
                | sort \
                | uniq -c \
                | tail -160 || true
              echo "Runtime reconciliation:"
              docker exec deploy-jarvis-worker-1 python -c "import json, pathlib; p=pathlib.Path(\"/var/lib/jarvis\"); calls=json.loads((p/\"calls_data.json\").read_text()); analyses=json.loads((p/\"analyses.json\").read_text()); audio=list((p/\"audio_temp\").glob(\"*.mp3\")); mapped=sum(1 for f in audio if any(c.get(\"audio\") and str(c[\"audio\"].get(\"file_id\")) == f.name.split(\"_\")[0] for c in calls)); print({\"calls\":len(calls),\"audio_files\":len(audio),\"mapped_audio\":mapped,\"analyses_file\":len(analyses)})"
              echo "AI model endpoint probe:"
              docker exec deploy-jarvis-worker-1 python -c "import os, requests; u=\"https://vibecode.bitrix24.tech/v1/ai/models\"; r=requests.get(u, headers={\"X-Api-Key\":os.environ[\"VIBE_API_KEY\"]}, timeout=30); print(r.status_code); print([x.get(\"id\") for x in r.json().get(\"data\", [])] if r.ok else r.text[:300])"
            '
