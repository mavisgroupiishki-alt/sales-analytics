name: Run Analysis

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Скачиваем код из репозитория
        uses: actions/checkout@v4

      - name: Устанавливаем Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Устанавливаем библиотеки
        run: pip install -r requirements.txt

      - name: Собираем звонки из Bitrix24
        env:
          BITRIX_WEBHOOK_URL: ${{ secrets.BITRIX_WEBHOOK_URL }}
        run: python src/bitrix.py

      - name: Генерируем HTML-отчёт
        run: python src/report_generator.py

      - name: Публикуем отчёт в docs/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "Нет изменений в отчёте"
          else
            git commit -m "Auto-update report $(date -u +'%Y-%m-%d %H:%M')"
            git push
          fi

      - name: Сохраняем артефакты для отладки
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calls-data
          path: |
            calls_data.json
            audio_temp/
          retention-days: 3
