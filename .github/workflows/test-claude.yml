name: Full Analysis (BitrixGPT)

on:
  # Ручной запуск с выбором количества звонков
  workflow_dispatch:
    inputs:
      limit:
        description: 'Сколько звонков обработать (-1 = все ≥40 сек)'
        required: true
        default: '-1'

  # Автозапуск каждый рабочий день в 18:10 Минск (15:10 UTC)
  # Понедельник-пятница
  schedule:
    - cron: '10 15 * * 1-5'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Скачиваем код
        uses: actions/checkout@v4

      - name: Устанавливаем Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Устанавливаем ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Готовим инструменты сборки
        run: |
          python -m pip install --upgrade pip
          pip install "setuptools<81" wheel

      - name: Устанавливаем библиотеки
        run: pip install -r requirements.txt

      - name: Ставим Whisper
        run: pip install --no-build-isolation openai-whisper==20240930

      - name: Скачиваем звонки ≥40 сек
        env:
          BITRIX_WEBHOOK_URL: ${{ secrets.BITRIX_WEBHOOK_URL }}
          # При автозапуске (расписание) — все звонки. При ручном — то, что выбрал пользователь.
          DOWNLOAD_AUDIO_COUNT: ${{ github.event.inputs.limit || '-1' }}
        run: python src/bitrix.py

      - name: Whisper + BitrixGPT анализ
        env:
          VIBE_API_KEY: ${{ secrets.VIBE_API_KEY }}
        run: python src/claude_analyzer.py

      - name: Генерируем HTML
        run: python src/report_generator.py

      - name: Публикуем
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ analyses.json
          if git diff --cached --quiet; then
            echo "Нет изменений"
          else
            git commit -m "Analysis update $(date -u +'%Y-%m-%d %H:%M')"
            git push
          fi

      - name: Артефакты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-debug
          path: |
            calls_data.json
            analyses.json
          retention-days: 7
