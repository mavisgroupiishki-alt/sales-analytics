name: Full Analysis (Haiku)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Сколько звонков обработать (макс) — 0 значит все'
        required: true
        default: '106'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Скачиваем код
        uses: actions/checkout@v4

      - name: Устанавливаем Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Устанавливаем ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Готовим инструменты сборки
        run: |
          python -m pip install --upgrade pip
          pip install "setuptools<81" wheel

      - name: Устанавливаем библиотеки
        run: pip install -r requirements.txt

      - name: Ставим Whisper
        run: pip install --no-build-isolation openai-whisper==20240930

      - name: Скачиваем звонки ≥ 40 сек
        env:
          BITRIX_WEBHOOK_URL: ${{ secrets.BITRIX_WEBHOOK_URL }}
          DOWNLOAD_AUDIO_COUNT: ${{ github.event.inputs.limit }}
        run: python src/bitrix.py

      - name: Транскрибация + Анализ через Claude Haiku
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python src/claude_analyzer.py

      - name: Генерируем HTML-отчёт
        run: python src/report_generator.py

      - name: Публикуем отчёт
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ analyses.json
          if git diff --cached --quiet; then
            echo "Нет изменений"
          else
            git commit -m "Full analysis update $(date -u +'%Y-%m-%d %H:%M')"
            git push
          fi

      - name: Сохраняем артефакты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-analysis
          path: |
            calls_data.json
            analyses.json
            audio_temp/
          retention-days: 7
