name: Full Analysis (BitrixGPT)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Сколько звонков обработать (-1 = все ≥40 сек)'
        required: true
        default: '-1'
  schedule:
    - cron: '10 15 * * 1-5'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Скачиваем код
        uses: actions/checkout@v4

      - name: Устанавливаем Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Устанавливаем библиотеки
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Скачиваем звонки
        env:
          BITRIX_WEBHOOK_URL: ${{ secrets.BITRIX_WEBHOOK_URL }}
          DOWNLOAD_AUDIO_COUNT: ${{ github.event.inputs.limit || '-1' }}
        run: python src/bitrix.py

      - name: Анализ звонков
        env:
          VIBE_API_KEY: ${{ secrets.VIBE_API_KEY }}
          BITRIX_WEBHOOK_URL: ${{ secrets.BITRIX_WEBHOOK_URL }}
        run: python src/claude_analyzer.py

      - name: Публикуем данные в репозиторий
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analyses.json calls_data.json
          if git diff --cached --quiet; then
            echo "Нет изменений"
          else
            git commit -m "Analysis update $(date -u +'%Y-%m-%d %H:%M')"
            git push
          fi

      - name: Деплой на Render (обновить данные)
        if: success()
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            curl -s "$RENDER_DEPLOY_HOOK" > /dev/null
            echo "✅ Render уведомлён"
          fi

      - name: Артефакты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-debug
          path: |
            calls_data.json
            analyses.json
          retention-days: 7
